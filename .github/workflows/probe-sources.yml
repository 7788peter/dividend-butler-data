name: probe-sources

# 連線測試：從 GitHub 的雲端機房，用跟 pipeline.py 一樣的方式連官方資料來源，看有沒有被擋。
# 只讀取、不寫入、不上傳。上市四份是必要的，上櫃三份與 CSV 是選用的。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try each official source
        run: |
          python3 - <<'PY'
          import csv, io, json, ssl, sys, time, urllib.request

          def ssl_context():
              ctx = ssl.create_default_context()
              if hasattr(ssl, "VERIFY_X509_STRICT"):
                  ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT
              return ctx

          TWSE = "https://openapi.twse.com.tw/v1"
          TPEX = "https://www.tpex.org.tw/openapi/v1"
          SOURCES = [
              ("meetings",      True,  "json", TWSE + "/opendata/t187ap41_L"),
              ("dividends",     True,  "json", TWSE + "/opendata/t187ap45_L"),
              ("exdiv",         True,  "json", TWSE + "/exchangeReport/TWT48U_ALL"),
              ("quotes",        True,  "json", TWSE + "/exchangeReport/STOCK_DAY_ALL"),
              ("exdiv_otc",     False, "json", TPEX + "/tpex_exright_prepost"),
              ("meetings_otc",  False, "json", TPEX + "/t187ap41_O"),
              ("quotes_otc",    False, "json", TPEX + "/tpex_mainboard_daily_close_quotes"),
              ("dividends_otc", False, "csv",  "https://mopsfin.twse.com.tw/opendata/t187ap45_O.csv"),
          ]
          failed_required = []
          for name, required, kind, url in SOURCES:
              t0 = time.time()
              accept = "application/json" if kind == "json" else "text/csv"
              req = urllib.request.Request(url, headers={"User-Agent": "dividend-butler/0.1", "Accept": accept})
              try:
                  with urllib.request.urlopen(req, timeout=60, context=ssl_context()) as r:
                      body = r.read()
                      status = r.status
                  if kind == "json":
                      n = len(json.loads(body.decode("utf-8")))
                  else:
                      n = len(list(csv.DictReader(io.StringIO(body.decode("utf-8-sig"), newline=""))))
                  print("OK    %-14s HTTP %s  %8d bytes  %5d rows  %.1fs" % (name, status, len(body), n, time.time() - t0))
              except Exception as e:
                  tag = "FAIL" if required else "warn"
                  print("%s  %-14s %s: %s" % (tag, name, type(e).__name__, str(e)[:120]))
                  if required:
                      failed_required.append(name)
                  else:
                      print("::warning::optional source %s could not be fetched from GitHub's servers" % name)
          if failed_required:
              print("::error::required sources failed: " + ", ".join(failed_required))
              sys.exit(1)
          print("All required sources reachable from GitHub's servers.")
          PY
